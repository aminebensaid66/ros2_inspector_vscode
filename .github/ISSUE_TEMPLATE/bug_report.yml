name: Bug report
description: Report a reproducible ROS2 Inspector VS Code issue
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: What happened and what did you expect? }
    validations: { required: true }
  - type: input
    id: extension
    attributes: { label: Extension version }
    validations: { required: true }
  - type: input
    id: inspector
    attributes: { label: ROS2 Inspector CLI version }
    validations: { required: true }
  - type: input
    id: vscode
    attributes: { label: VS Code / OS }
    validations: { required: true }
  - type: textarea
    id: output
    attributes: { label: ROS2 Inspector output, description: Paste relevant Output panel logs. }
