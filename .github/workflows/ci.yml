name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "${{ matrix.node }}" }
      - run: npm run verify
      - run: npm run package
      - name: Inspect VSIX
        shell: bash
        run: python - <<'PY'
          import glob, zipfile
          p=glob.glob('*.vsix')[0]
          with zipfile.ZipFile(p) as z:
              names=set(z.namelist())
              assert 'extension.vsixmanifest' in names
              assert 'extension/package.json' in names
              assert 'extension/src/extension.js' in names
          print('VSIX structure: PASS')
          PY
  analyzer-contract:
    name: ROS2 Inspector 0.1.3 contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - run: python -m pip install "ros2inspector==0.1.3"
      - run: ros2inspector --version
      - run: ros2inspector --quiet graph full --format json -C fixtures/demo_ws > /tmp/uam.json
      - run: python -c "import json; d=json.load(open('/tmp/uam.json')); assert d['graph']['nodes']; assert 'deployments' in d; print(d['summary'])"
