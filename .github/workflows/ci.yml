name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "${{ matrix.node }}" }
      - run: npm run verify
      - run: npm run package
      - run: npm run validate:vsix

  analyzer-contract:
    name: ROS2 Inspector 0.1.3 contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - run: python -m pip install "ros2inspector==0.1.3"
      - run: npm run test:contract
